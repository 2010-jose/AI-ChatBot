<!DOCTYPE html>
<html>
<head>
    <title>AI ChatBot</title>
    <link rel="icon" type="image/png" href="https://www.pngarts.com/files/11/Google-Logo-Icon-Free-PNG-Image.png">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
        }

        form {
            display: flex;
            gap: 10px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        /* Input Moderno */
        input[type="text"] {
            padding: 12px 20px;
            border: 2px solid #333;
            border-radius: 8px;
            background-color: #252525;
            color: white;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            width: 300px;
        }

        input[type="text"]:focus {
            border-color: #007bff;
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.5);
        }

        /* Botão com Efeito Gradient */
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #007bff, #00d4ff);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        button:active {
            transform: translateY(0);
        }
    </style>

</head>
<body>
    <style>
        /* Estilo das bolhas de chat */
        .chat-container { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        
        .msg { padding: 12px 18px; border-radius: 20px; max-width: 80%; line-height: 1.4; }
        
        .user { align-self: flex-end; background-color: #007bff; color: white; border-bottom-right-radius: 2px; }
        
        .bot { align-self: flex-start; background-color: #333; color: white; border-bottom-left-radius: 2px; }

        .input-area { position: sticky; bottom: 20px; width: 100%; max-width: 600px; }
    </style>

    <div class="chat-container">
        {% for mensagem in chat %}
            <div class="msg {{ mensagem.role }}">
                {{ mensagem.text }}
            </div>
        {% endfor %}
    </div>

    <div class="input-area">
        <form method="POST" style="display: flex; width: 100%;">
            <input type="text" name="pergunta" placeholder="Digite sua mensagem..." required style="flex-grow: 1;">
            <button type="submit">Enviar</button>
        </form>
    </div>
</body>
</html>
